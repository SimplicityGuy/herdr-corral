epic:
  title: 'corral v1: visual editor for herdr config.toml (Console design language)'
  description: |
    corral (SimplicityGuy/herdr-corral) is a static single-page web app that edits herdr's
    config.toml visually. Load an existing file (drop, pick, paste) or start from herdr's
    defaults; arrange sidebar rows and the status bar by drag and drop; record keybindings;
    pick a theme; watch a faithful mock of herdr redraw as you go; download the result with
    every comment and untouched line preserved byte-for-byte. Nothing leaves the browser.

    Reference: https://herdr.dev/docs/config-reference/ (167 settings across General, Server,
    Theme, Terminal, Updates, Keybindings, UI and sidebar, Notifications, Sound, Session,
    Worktrees, Remote, Advanced, Experimental). herdr 0.8.2 is installed on the build machine
    at /opt/homebrew/bin/herdr; `herdr --default-config` prints the annotated default file
    and is the ground truth the schema is cross-checked against.

    The name: a corral is the pen where the herd is gathered and arranged, and "to corral" is
    what this app does to a sprawling config. herdr herds coding agents; corral lays the herd
    out. Sibling tools in the ecosystem use short lowercase one-word names.

    Design decisions are recorded in docs/design/ADR-0001-stack.md (stack) and
    docs/design/ADR-0002-console-design-language.md (the Console design language: the editor
    is a TUI in the browser, the preview IS the editor). docs/design/console-direction.html
    is the visual contract for the shell. Every UI bead follows ADR-0002.

    Deploy (Cloudflare Pages via homelab OpenTofu) is out of scope for this molecule.
  design: |
    Stack (ADR-0001): Vite · React 19 · TypeScript · Tailwind CSS 4 · shadcn/ui · dnd-kit
    (core + sortable) · zustand · smol-toml (parse only) · vitest + Testing Library ·
    Playwright · oxlint · pnpm. `pnpm check` = typecheck + lint + test + build.

    Layers and ownership:
    - src/schema/   reference.json (generated by scripts/gen-reference.ts from the herdr.dev
                    reference HTML: <li class="config-reference-row"> rows carrying key, type,
                    default, description, enum options), default-config.toml (from
                    `herdr --default-config`), themes.json (built-in palettes), index.ts accessors.
    - src/model/    paths (dotted key ↔ TOML table/key), toml-value (formatter), toml-doc
                    (comment-preserving patcher over the original text), parse (smol-toml →
                    path map), keys (chord grammar), validate (diagnostics), export (leaf diff,
                    patch-or-generate).
    - src/store/    zustand: original text, parsed values, edits (path → value | removed),
                    effective config (defaults ⊕ file ⊕ edits), undo/redo, selection, section.
    - src/components/preview/   HerdrPreview + sample data + region → keys map.
    - src/components/shell/     TopLine, SettingsTree, DiagnosticsLine, CommandPalette,
                                InlinePopover host (anchored to a preview region).
    - src/components/editors/   RowsEditor, StatusBarEditor, KeysEditor, ThemeEditor,
                                SectionForm (generic typed fields).
    - src/components/io/        Landing (import), ExportDialog (download / copy / snippet / diff).

    Invariants (every bead preserves them; tests enforce them):
    1. Export never regenerates a loaded file: TomlDocument applies targeted text edits and
       untouched lines come back byte-identical (fixture test). Only "start from defaults"
       generates a whole file.
    2. Only changed leaves are written; an explicit value equal to the default is still
       written; "reset" removes the key.
    3. The schema is generated, never hand-edited; schema.test.ts cross-checks it against
       default-config.toml.
    4. Validation mirrors herdr (limits: 16 rows × 16 tokens, tab_bar_right entries ≤ 16,
       chord grammar, navigate-mode restrictions, color syntax, enum sets, integer ranges).
    5. Every schema key belongs to exactly one UI home (sections.test.ts).
    6. Download is blocked while diagnostics contain errors.

    Dependency shape: scaffold → {schema, tomldoc} → {store, validate} → shell → preview →
    editors (rows, statusbar+theme batch, keys, forms) and io → e2e → docs.
issues:
  - handle: scaffold
    title: 'Project scaffold: Vite + React 19 + TS + Tailwind 4 + shadcn/ui, tooling, CI, Console tokens'
    type: task
    priority: 1
    size: l
    model: anthropic/opus
    harness: claude
    component: infra
    description: |
      Greenfield. Create the pnpm project and every tool the rest of the molecule relies on so
      later beads only add features. The app renders a placeholder shell in the Console chrome
      (ADR-0002) so tokens and fonts are proven, not just declared.
    design: |
      - `pnpm create vite` (react-ts), then Tailwind 4 via @tailwindcss/vite, shadcn/ui init
        (components under src/components/ui; add button, input, select, switch, checkbox,
        dialog, popover, tooltip, command, scroll-area, separator, badge, kbd, tabs, slider,
        toggle-group, sonner). Restyle shadcn's CSS variables to the ADR-0002 tokens:
        square corners (--radius: 0), the catppuccin-mocha chrome palette, coral accent.
      - @fontsource-variable/jetbrains-mono as the single font family; body 13px / 1.45.
      - dnd-kit core + sortable + utilities, zustand, smol-toml, lucide-react installed.
      - vitest + @testing-library/react + jsdom (src/test/setup.ts), Playwright config
        serving `dist/` on :4173 (webServer via `vite preview`), oxlint config.
      - package.json scripts: dev, build (tsc -b && vite build), preview, typecheck (tsc -b),
        lint (oxlint), test (vitest run), test:watch, test:e2e (playwright test),
        check (typecheck && lint && test && build), gen:reference (placeholder script that
        exits 0 with a TODO until the schema bead lands).
      - .github/workflows/ci.yml: pnpm/action-setup + setup-node 22, install with frozen
        lockfile, run check, install Playwright chromium and run test:e2e, upload the
        Playwright report on failure. Trigger on push and pull_request.
      - .gitignore covers node_modules, dist, playwright-report, test-results, coverage.
      - index.html title "corral", favicon.svg: a coral ▐▛█▜▌-style mark (inline SVG).
      - App.tsx renders the three-part Console layout (top line, framed left panel, framed
        center panel, diagnostics line) with static text, using the tokens, so the shell bead
        replaces content rather than inventing structure.
      - CLAUDE.md: replace the placeholder Build & Test / Architecture / Conventions sections
        with the real commands, the layer map above, and the six invariants. Note the nvm
        shim caveat: call ~/.nvm/versions/node/v26.7.0/bin/node and /opt/homebrew/bin/pnpm
        directly if `node`/`pnpm` print `_nvm_load` errors in non-interactive shells.
    acceptance: |
      - `pnpm install --frozen-lockfile && pnpm check` passes from a clean clone.
      - `pnpm test:e2e` passes with one smoke test that loads the page and sees the top line.
      - `pnpm dev` shows the Console chrome: dark tokens, JetBrains Mono, framed panels with
        ┤ caption ├ captions, coral accent visible on at least one element.
      - CI workflow file exists and runs check + e2e; a push to main triggers it.
      - CLAUDE.md documents commands, layout, invariants and the nvm caveat.
  - handle: schema
    title: 'Generated schema: scrape herdr.dev reference, capture herdr default config, theme palettes'
    type: feature
    priority: 1
    size: m
    model: anthropic/opus
    harness: claude
    component: schema
    deps: [scaffold]
    description: |
      Everything the editor knows about herdr's settings comes from generated data, so a herdr
      upgrade is a regenerate-and-diff, never a hand edit. Three artifacts: reference.json (the
      167 settings with type, default, description, section, enum options, constraints),
      default-config.toml (the annotated default file herdr prints), themes.json (palette for
      every built-in theme so the preview can paint them).
    design: |
      - scripts/gen-reference.ts (run with `pnpm gen:reference`, tsx): fetch
        https://herdr.dev/docs/config-reference/, parse each
        `<li class="config-reference-row" data-search=...>` → key
        (code.config-reference-key), type (span.config-reference-type: keybinding, enum,
        boolean, color, string, integer, path, "list of token rows", array,
        "table of token rows", "list of strings"), default (span.config-reference-default,
        `unset` → null), description (p.config-reference-desc), enum options (the option
        spans/list that follow the description; e.g. top/bottom, compact/hidden), section id
        (the enclosing h2.config-reference-title id `ref-*` and title). Sort deterministically;
        write src/schema/reference.json. Keep the parser tolerant: log and fail on a count
        below 150 so a site redesign is noticed.
      - src/schema/default-config.toml: output of `/opt/homebrew/bin/herdr --default-config`
        (herdr 0.8.2). Commit it; document the refresh command.
      - src/schema/themes.json: for each built-in theme name listed in default-config.toml
        (catppuccin, catppuccin-latte, terminal, tokyo-night, dracula, nord, gruvbox, one-dark,
        solarized, kanagawa, rose-pine, vesper) the color tokens theme.custom.* can override
        (accent, panel_bg, sidebar_bg, active_row_bg, selection_bg, surface0, surface1,
        surface_dim, overlay0, overlay1, text, subtext0, mauve, green, yellow, red, blue, teal,
        peach). Source them from herdr's repository (github.com/herdrdev/herdr, theme
        definitions under src/) at the 0.8.x tag; cite the file path in a comment field. If a
        theme cannot be sourced, mark it `"approximate": true` rather than inventing silently.
      - src/schema/index.ts: typed accessors (allKeys, byKey, bySection, defaultOf, typeOf,
        enumOptions, isKeybinding, sidebarTokenBuiltins for agents/spaces, tabBarEntryTypes).
      - Tests: schema.test.ts asserts every reference key appears (commented or not) in
        default-config.toml and every `# key = ` line in default-config.toml is in the
        reference, with an explicit allowlist for documented exceptions; every enum has ≥2
        options; defaults parse as their declared type.
    acceptance: |
      - `pnpm gen:reference` regenerates src/schema/reference.json with 167 entries and the
        working tree is clean afterwards (deterministic output).
      - schema.test.ts passes and lists exceptions explicitly (no silent skips).
      - themes.json has every built-in theme named in default-config.toml with all 19 tokens.
      - `pnpm check` green.
  - handle: tomldoc
    title: 'TOML document model: parse, comment-preserving patcher, value formatter'
    type: feature
    priority: 1
    size: l
    model: anthropic/opus
    harness: claude
    component: model
    deps: [scaffold]
    description: |
      The promise that makes corral safe to use on a real config: export rewrites only the
      settings you changed and every other byte comes back as it went in. smol-toml parses;
      we own the writer.
    design: |
      - src/model/paths.ts: dotted path helpers; split a key into (table header, key) per
        TOML rules; array-of-tables paths like keys.command[2].key; quoting for keys that
        need it (rows_by_agent ids are bare identifiers).
      - src/model/parse.ts: smol-toml parse → flat Map<path, value> plus the raw tree; surface
        syntax errors with line/column.
      - src/model/toml-value.ts: format any value as TOML: strings (escape, prefer basic
        strings), integers, booleans, arrays (inline, one line when short), inline tables for
        styled tokens `{ token = "workspace", fg = "#89b4fa", bold = true }`, array-of-tables
        blocks for [[keys.command]].
      - src/model/toml-doc.ts: TomlDocument(text). Index every table header ([a.b],
        [[a.b]] with occurrence index) and every key line (including commented-out
        `# key = value` lines under the right header, remembered as "commented default" so a
        set can replace the comment line in place). Operations: set(path, value), remove(path),
        text(). set on an existing key replaces only the value span; set on a commented
        default uncomments and replaces; set on a missing key appends under its header (after
        the header's last key, before the next header) and creates the header at the end of
        the file if absent; remove deletes the line (or re-comments it if it originated as a
        commented default). Preserve line endings (LF/CRLF) and a leading BOM. Never touch
        lines outside the edited spans.
      - src/test/fixture-user-config.toml: a realistic user config with comments, blank
        lines, a [theme.custom] table, [[keys.command]] entries, sidebar rows with styled
        tokens, and one commented default.
      - Tests: round-trip with zero edits is identical; each operation type changes exactly
        the expected lines (diff-based assertion); CRLF and BOM survive; parse errors report
        positions.
    acceptance: |
      - toml-doc.test.ts proves: no-op round trip is byte-identical; set/remove/append/create-
        header each touch only the intended lines; CRLF and BOM preserved.
      - toml-value.test.ts covers strings with quotes and backslashes, arrays, inline tables,
        array-of-tables.
      - `pnpm check` green.
  - handle: store
    title: 'Document store: effective config, edits, undo/redo, selection, export builder'
    type: feature
    priority: 1
    size: m
    model: anthropic/opus
    harness: claude
    component: model
    deps: [schema, tomldoc]
    description: |
      One zustand store is the single source of truth for the UI: what the file said, what the
      user changed, what herdr would effectively see, and what is selected. Export is derived
      from it.
    design: |
      - src/store/config.ts: state { source: 'defaults' | 'file', originalText, parsed
        Map, edits Map<path, value | REMOVED>, history (past/future stacks of edits maps),
        selection { section, key?, region? }, section }. Actions: loadText(text),
        loadDefaults(), set(path, value), reset(path), undo(), redo(), select(...),
        setSection(n). Selectors: effective(path) = edits ⊕ parsed ⊕ schema default;
        changedLeaves(); isDirty().
      - src/model/export.ts: leaves() enumerates schema keys plus dynamic leaves
        (ui.sidebar.agents.rows_by_agent.<id>, keys.command[i]); diff(original, effective) →
        list of set/remove ops; patch(originalText, ops) via TomlDocument for source='file';
        generate(effective) for source='defaults' writes a compact file with only set keys,
        grouped by table, with a one-line header comment.
      - Keep edits as a Map keyed by path so undo/redo is cheap (structural sharing).
      - Tests: store.test.ts (set/reset/undo/redo, effective precedence), export.test.ts
        (patch vs generate; explicit value equal to default still written; reset removes).
    acceptance: |
      - store.test.ts and export.test.ts pass and cover invariants 1 and 2 from the epic.
      - Exporting an unedited loaded file yields the original text exactly.
      - `pnpm check` green.
  - handle: validate
    title: 'Validation mirroring herdr: types, enums, colors, chords, row limits, cross-field'
    type: feature
    priority: 1
    size: m
    model: anthropic/opus
    harness: claude
    component: model
    deps: [schema, tomldoc]
    description: |
      corral must warn about the same things herdr warns about at startup, so a downloaded
      file never surprises. Rules come from herdr's own source (github.com/herdrdev/herdr,
      src/config/*.rs at the 0.8.x tag); cite the source for every non-obvious rule.
    design: |
      - src/model/keys.ts: chord grammar parse/format (modifiers ctrl/alt/shift/super,
        `prefix+`, named keys like tab/esc/enter/minus/up/down/left/right, function keys,
        single characters); normalize case and modifier order; navigate-mode keys must not
        include prefix+, esc, enter, tab, or 1..9 (per default-config.toml comments).
      - src/model/validate.ts: validate(effective, parsedUnknownKeys) → Diagnostic[] {
        severity: 'error' | 'warning', path, message }. Rules: declared type per schema
        (integer, boolean, enum membership, string), integer ranges where documented
        (sidebar widths, mobile threshold, delay_seconds, scrollback), color syntax (#rgb,
        #rrggbb, named colors from herdr's list, rgb(r,g,b), and "reset" where allowed),
        sidebar rows shape (array of arrays; entries string or { token, fg, bold, dim }; ≤16
        rows, ≤16 tokens per row; built-in or $custom token names), tab_bar_right entries
        (type ∈ zoom/hostname/datetime/text/command with the fields each needs), keys.command
        entries (key, type ∈ shell/pane/popup, command, width/height cells or percent),
        unknown keys (warning, with a "did you mean" against schema keys), cross-field:
        sidebar_min_width ≤ sidebar_width ≤ sidebar_max_width, duplicate chords across
        keys.* and keys.command (warning), theme.name ∈ built-ins.
      - Tests for each rule family with positive and negative cases; a fixture of herdr's
        real warnings if obtainable by running `herdr` against a bad config is a bonus, not
        required.
    acceptance: |
      - validate.test.ts and keys.test.ts pass with positive and negative cases per rule
        family listed in design.
      - A config with sidebar_min_width > sidebar_width yields a warning at the right path.
      - Unknown keys are reported as warnings with the nearest schema key suggested.
      - `pnpm check` green.
  - handle: shell
    title: 'Console shell: top line, settings tree, diagnostics line, command palette, popover host'
    type: feature
    priority: 1
    size: l
    model: anthropic/opus
    harness: claude
    component: ui
    deps: [store, validate]
    description: |
      The frame every editor lives in, built exactly to ADR-0002 and
      docs/design/console-direction.html. Keyboard-first, with the preview slot left as a
      placeholder for the preview bead to fill.
    design: |
      - src/components/shell/TopLine.tsx: mark, file name + dirty marker, section switches
        [1] layout [2] sidebar [3] status [4] keys [5] theme [6] all (store.section), right
        side hints. Global key handling: 1–6 switch sections when focus is not in an input.
      - src/components/shell/SettingsTree.tsx: sections → keys with current effective value
        colored by type; `/` focuses a filter input; j/k move focus; enter opens the key's
        editor (an inline popover anchored to the tree row when no preview region exists);
        d resets the focused key; u undoes. Rows are buttons with accessible names
        "<key> = <value>". Footer with the key hints.
      - src/components/shell/DiagnosticsLine.tsx: mode badge (EDIT default; other beads set
        DRAG/RECORD), error and warning counts with the first warning's text, changed-keys
        count, `:diff` and `:w download` actions (download disabled with a tooltip while
        errors exist; io bead wires the actual export).
      - src/components/shell/CommandPalette.tsx: shadcn command on ctrl+k listing every key
        (jump to it) and actions (undo, redo, reset key, switch section, download).
      - src/components/shell/InlinePopover.tsx: a host that renders an editor anchored to
        a DOM rect (preview region or tree row) with the coral frame, caption, and the
        enter/esc/tab conventions; focus trap; esc closes without applying when the editor
        is transactional.
      - src/lib/sections.ts: the map of every schema key to exactly one section/editor home
        (layout, sidebar, status, keys, theme, all) + sections.test.ts enforcing coverage.
      - Replace the App.tsx placeholder with the real shell; the center frame renders a
        "preview lands here" placeholder until the preview bead.
    acceptance: |
      - Keyboard walkthrough works without a mouse: 1–6 switch sections, / filters, j/k
        move, enter opens an editor popover, esc closes it, u undoes, ctrl+k opens the
        palette and jumps to a key.
      - sections.test.ts proves every schema key has exactly one home.
      - Component tests for TopLine (section switch), SettingsTree (filter + enter), and
        DiagnosticsLine (download disabled on errors).
      - Visual match to console-direction.html: framed panels with captions, tokens, mono.
      - `pnpm check` green.
  - handle: preview
    title: 'HerdrPreview: faithful mock of herdr driven by the effective config, click-to-edit regions'
    type: feature
    priority: 1
    size: l
    model: anthropic/opus
    harness: claude
    component: ui
    deps: [shell]
    description: |
      The center of the Console design: a mock of herdr's desktop layout that redraws from
      the effective config and whose regions open the editor for the keys that draw them.
      Sample data is rich enough that every sidebar token has something to show.
    design: |
      - src/components/preview/sample.ts: 3 spaces (with branch, git status, worktree child),
        4 agents (claude working, codex waiting, gemini idle, pi done) with workspace, tab,
        pane, terminal_title, and custom metadata ($model, $ticket) so $name tokens render.
      - src/components/preview/tokens.ts: render a token row for an agent/space: built-ins
        state_icon (dots vs symbols per ui.status_indicators), state_text, workspace, tab,
        pane, agent, terminal_title, terminal_title_stripped, branch, git_status, plus $custom
        lookups; apply { fg, bold, dim } styles; contextual default colors.
      - src/components/preview/HerdrPreview.tsx: theme colors from themes.json ⊕
        theme.custom ⊕ ui.accent (also honors theme.auto_switch by showing the dark_name
        theme with a light/dark toggle chip in the caption); tab bar (position top/bottom,
        hide_tab_bar_when_single_tab, tab_bar_right entries with separator: zoom "100%",
        hostname, datetime formatted per entry, text, command output placeholder); sidebar
        (width in columns mapped to ch units, sidebar_min/max clamp, collapsed_mode compact
        vs hidden with a toggle chip, agent_panel_sort spaces vs priority, row_gap, spaces
        rows, agents rows with rows_by_agent overrides); panes (2×2 grid with
        pane_borders/gaps/scrollbars toggles); toast (ui.toast.herdr.position, delivery
        off hides it); mobile layout when width < mobile_width_threshold via a chip.
      - Regions: each drawn region carries data-region and the list of keys it owns
        (src/components/preview/regions.ts). Click → store.select({ key, region rect }) and
        the shell opens the InlinePopover for that key's editor. Hover shows a dashed
        outline; selected shows the coral outline.
      - Component tests: tokens.test.ts (each built-in token, styles, $custom); preview
        reacts to sidebar_width, collapsed_mode, tab_bar_position, toast position,
        status_indicators.
    acceptance: |
      - Changing any of these keys in the store visibly changes the preview and a test
        asserts it: sidebar_width, sidebar_collapsed_mode, tab_bar_position,
        hide_tab_bar_when_single_tab, tab_bar_right, ui.accent, theme.name,
        theme.custom.sidebar_bg, ui.toast.herdr.position, status_indicators, agents.rows.
      - Clicking an agent row, the tab bar's right side, and the toast each selects the
        owning key and opens the popover host with that key's caption.
      - Every built-in token and a $custom token render in tokens.test.ts.
      - `pnpm check` green.
  - handle: rows-editor
    title: 'Sidebar rows editor: drag-and-drop tokens and rows, inline styles, per-agent overrides'
    type: feature
    priority: 1
    size: l
    model: anthropic/opus
    harness: claude
    component: ui
    deps: [preview]
    description: |
      The headline drag-and-drop surface: ui.sidebar.agents.rows, ui.sidebar.spaces.rows and
      ui.sidebar.agents.rows_by_agent. Opens from the preview's sidebar rows and from the
      tree, in the inline popover.
    design: |
      - src/components/editors/RowsEditor.tsx with dnd-kit: rows are sortable vertically,
        tokens sortable within and between rows; a token palette (built-ins for the panel
        kind + "custom $name" input) drags into rows; dragging a token out of the popover
        removes it. Keyboard sensor enabled; explicit move-left/right/up/down commands in the
        popover for every token and row. Mode badge shows DRAG while dragging.
      - Token chip click → style strip: fg (swatches from the current theme's tokens + hex
        input, "contextual default" option), bold, dim toggles; writes an inline table only
        when a style is set, else a plain string.
      - Limits enforced in the UI (16 rows, 16 tokens per row) with the diagnostics line
        explaining a refused drop.
      - rows_by_agent: a chip row of canonical agent ids (from the schema's ui.sound.agents.*
        list) to add an override that starts as a copy of agents.rows; remove override.
      - Persist through store.set with the exact value shape the patcher formats.
    acceptance: |
      - Dragging a token between rows, reordering rows, and adding a custom $token each
        update the preview and the export text (component tests with dnd-kit's keyboard
        sensor).
      - Styling a token writes { token, fg, bold, dim } and unstyling returns a plain string.
      - The 17th row and the 17th token in a row are refused with an explanation.
      - rows_by_agent override for "claude" round-trips through export.
      - `pnpm check` green.
  - handle: statusbar-editor
    title: 'Status bar editor: sortable tab_bar_right entries, separator, tab bar options'
    type: feature
    priority: 2
    size: s
    model: anthropic/sonnet
    harness: claude
    component: ui
    batch: bar-and-theme
    deps: [preview]
    description: |
      ui.tab_bar_right is an ordered list of typed entries (zoom, hostname, datetime, text,
      command). Edit it as a sortable list with per-type fields, next to the tab bar's other
      knobs, in the popover opened from the preview's tab bar.
    design: |
      - src/components/editors/StatusBarEditor.tsx: dnd-kit sortable list; "add entry" picks
        a type; per-type fields (text: text; datetime: format; command: command + interval
        if the schema documents one); remove; ≤16 entries. tab_bar_right_separator input,
        tab_bar_position toggle, hide_tab_bar_when_single_tab switch.
      - Values written as the reference documents (inline tables per entry).
    acceptance: |
      - Adding, reordering and removing entries updates the preview's right side and export.
      - Separator and position changes reflect in the preview.
      - `pnpm check` green.
  - handle: theme-editor
    title: 'Theme editor: built-in theme swatches, auto-switch, custom color overrides, accent'
    type: feature
    priority: 2
    size: s
    model: anthropic/sonnet
    harness: claude
    component: ui
    batch: bar-and-theme
    deps: [preview]
    description: |
      Section [5] theme. Pick a built-in theme from swatches painted with themes.json, set
      auto_switch with dark/light names, override any theme.custom.* token, and set ui.accent.
    design: |
      - src/components/editors/ThemeEditor.tsx: swatch grid (each swatch shows the theme's
        base/sidebar/text/accent colors), auto_switch switch revealing dark_name/light_name
        selects, a token list for theme.custom.* with a color field (hex input + named
        color list + rgb() + "reset" where allowed) and a reset-to-theme action, ui.accent
        field. Uses src/components/common/ColorField.tsx (create it here; shared with forms).
    acceptance: |
      - Choosing a theme repaints the preview; overriding sidebar_bg repaints only that
        surface; reset removes the key from export.
