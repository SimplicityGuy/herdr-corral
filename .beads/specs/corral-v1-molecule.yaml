  - handle: e2e
    title: 'Playwright end-to-end flows: import → drag → record → theme → download byte checks'
    type: task
    priority: 1
    size: m
    model: anthropic/opus
    harness: claude
    component: infra
    deps: [rows-editor, statusbar-editor, theme-editor, keys-editor, forms, io]
    description: |
      Prove the product promises in a real browser against the built dist/, so the molecule
      ends with a green demo of every editor and of invariant 1.
    design: |
      - e2e/editor.spec.ts flows: (1) open fixture by file chooser, download without edits,
        assert downloaded bytes equal the fixture; (2) drag $branch into agents row 1 via
        dnd-kit keyboard sensor, download, assert only the rows line changed; (3) record a
        chord for split_vertical; (4) reorder a tab_bar_right entry; (5) switch theme to
        nord and override accent; (6) set sidebar_min_width above sidebar_width, assert the
        diagnostics line warns; set an invalid color, assert download disabled; (7)
        keyboard-only navigation: 1–6, /, j/k, enter, esc, u, ctrl+k.
      - Downloads captured with page.waitForEvent('download') and compared as buffers.
      - Keep the suite under 90s; run in CI on chromium only.
    acceptance: |
      - `pnpm test:e2e` passes locally against `pnpm build` output and in CI.
      - Flow 1 asserts byte equality; flow 2 asserts a single changed line.
      - Each editor is exercised at least once.
