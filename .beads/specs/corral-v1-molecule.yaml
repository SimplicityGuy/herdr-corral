        the user on the landing.
      - src/components/io/ExportDialog.tsx (on `:w` and the palette): tabs for full file and
        changed hunks (unified diff computed from original vs export text); actions:
        download config.toml (Blob), copy to clipboard, copy install snippet
        (`mkdir -p ~/.config/herdr && cat > ~/.config/herdr/config.toml <<'EOF' … EOF` then
        `herdr server reload-config`). Download and snippet disabled while errors exist,
        with the first error named.
      - "Start over" and "open another file" with confirmation when dirty.
      - Nothing leaves the browser: no network calls anywhere in the app (test asserts no
        fetch in src outside scripts/).
