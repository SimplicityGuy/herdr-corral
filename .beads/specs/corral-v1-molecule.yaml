    harness: claude
    component: ui
    deps: [shell]
    description: |
      Getting a file in and out is the whole point. Import must be forgiving; export must
      be honest (diff before download) and blocked while errors exist.
    design: |
      - src/components/io/Landing.tsx: first screen in the Console chrome: "open
